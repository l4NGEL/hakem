include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = eu-central-1
  accountId = 000000000000
}

queues {
  hakem-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "hakem-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  hakem-jobs-dlq {}
}
