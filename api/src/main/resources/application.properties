spring.application.name=hakem-api

hakem.aws.region=${AWS_REGION:eu-central-1}
# Empty on AWS; set only to point at local emulators.
hakem.aws.s3-endpoint=${HAKEM_S3_ENDPOINT:}
hakem.aws.dynamodb-endpoint=${HAKEM_DYNAMODB_ENDPOINT:}
hakem.aws.sqs-endpoint=${HAKEM_SQS_ENDPOINT:}

hakem.bucket=${HAKEM_BUCKET:hakem-manuscripts}
hakem.jobs-table=${HAKEM_JOBS_TABLE:hakem-jobs}
hakem.queue-url=${HAKEM_QUEUE_URL:}
hakem.max-chars=400000
hakem.cors-origins=${HAKEM_CORS_ORIGINS:}

# Finished reports are cached in Redis; set HAKEM_CACHE=simple to run without Redis.
spring.cache.type=${HAKEM_CACHE:redis}
spring.cache.cache-names=reports
spring.cache.redis.time-to-live=1h
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
management.health.redis.enabled=${HAKEM_REDIS_HEALTH:true}
